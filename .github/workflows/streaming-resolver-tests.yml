name: Streaming resolver tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/dynamic-hianime-audio-tracks]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run streaming resolver unit tests
        run: npm test
